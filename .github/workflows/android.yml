name: Android CI

on:
  push:
    tags:
      - 'v0.*'
  workflow_dispatch:

jobs:
  build:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Build with Gradle
        run: ./gradlew build
      - name: Store Unsigned APK files
        uses: actions/upload-artifact@v4
        with:
          name: Unsigned APK Files
          path: app/build/outputs/apk/**/*.apk
      - name: Move APKs
        run: |
          mkdir apks
          mv app/build/outputs/apk/*/release/*.apk apks
      - name: ZipAlign & Sign APK
        uses: TheDcoder/zipalign-sign-android-release@main
        id: sign_app
        env:
          BUILD_TOOLS_VERSION: 35.0.0
        with:
          releaseDirectory: apks
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
      - name: Store Signed APK files
        uses: actions/upload-artifact@v7
        with:
          name: Signed APK Files
          path: apks
      - name: Fetch upstream release metadata
        id: upstream_release
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          release=$(curl --fail --silent --show-error \
            "https://api.github.com/repos/moneytoo/Player/releases/tags/$TAG_NAME")
          printf 'prerelease=%s\n' "$(jq -r '.prerelease' <<< "$release")" >> "$GITHUB_OUTPUT"
          jq -r '.body // ""' <<< "$release" > upstream-release-notes.md
      - name: Automatic Release
        uses: softprops/action-gh-release@v3
        with:
          make_latest: 'true'
          prerelease: ${{ steps.upstream_release.outputs.prerelease }}
          body_path: upstream-release-notes.md
          generate_release_notes: false
          files: apks/*-signed.apk
          fail_on_unmatched_files: true
